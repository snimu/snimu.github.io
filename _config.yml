title: snimu's blog
author: Sebastian
description: Thoughts on LLMs, AI, and language model training
url: "https://snimu.github.io"

remote_theme: daattali/beautiful-jekyll@6.0.1

# Beautiful Jekyll specific settings
navbar-links:
  About: "about"
  Posts: "/"

social-network-links:
  github: snimu

excerpt_length: 50
feed_show_excerpt: true
feed_show_tags: true

# Markdown and math settings
markdown: kramdown
kramdown:
  math_engine: mathjax

# Add MathJax support
mathjax: true  # Beautiful Jekyll has built-in MathJax support that's enabled with this flag